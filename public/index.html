<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Velvet Dial</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Velvet Dial" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --bg-black: #000000;
      --bg-dark: #121212;
      --bg-elevated: #181818;
      --spotify-green: #1db954;
      --spotify-green-hover: #1ed760;
      --brat-neon: #8ace00;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .aviso-ios { position: fixed; left: 10px; right: 10px; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 1000; background: #1f1f1f; border: 1px solid var(--brat-neon); border-radius: 12px; padding: 10px 38px 10px 12px; font-size: 13px; line-height: 1.35; color: var(--text-primary); box-shadow: 0 6px 24px rgba(0,0,0,.6); }
    .aviso-ios button { position: absolute; right: 6px; top: 4px; background: none; border: 0; color: var(--text-secondary); font-size: 20px; padding: 4px 8px; cursor: pointer; }
    body { background-color: var(--bg-black); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .main-container { display: flex; flex: 1; gap: 8px; padding: 8px; overflow: hidden; }
    .sidebar { width: 260px; overflow-y: auto; background: var(--bg-dark); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .logo { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--brat-neon); }
    .token-box { background: var(--bg-elevated); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
    .token-box label { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
    .token-box input { background: #2a2a2a; border: 1px solid #3e3e3e; color: white; padding: 8px; border-radius: 4px; font-size: 12px; }
    .btn-login { background: var(--spotify-green); color: black; text-align: center; text-decoration: none; font-weight: 700; padding: 10px; border-radius: 20px; font-size: 13px; transition: 0.2s; }
    .btn-login:hover { background: var(--spotify-green-hover); }

    .content { flex: 1; background: linear-gradient(180deg, #222b18 0%, var(--bg-dark) 45%); border-radius: 8px; padding: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .album-art { width: 260px; height: 260px; border-radius: 8px; box-shadow: 0 16px 40px rgba(0,0,0,0.6); object-fit: cover; margin-bottom: 24px; background: #282828; }
    .track-title { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .track-artist { font-size: 16px; color: var(--text-secondary); margin-bottom: 24px; }

    .dj-status-card { background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(138, 206, 0, 0.3); padding: 16px 24px; border-radius: 12px; max-width: 540px; min-height: 75px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .dj-badge { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--brat-neon); font-weight: 700; }
    .dj-script { font-size: 14px; color: #e0e0e0; font-style: italic; line-height: 1.4; }

    .player-bar { height: 90px; background: var(--bg-black); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
    .now-playing-mini { display: flex; align-items: center; gap: 14px; width: 30%; }
    .mini-cover { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; background: #282828; }
    .mini-info h4 { font-size: 14px; font-weight: 600; }
    .mini-info p { font-size: 12px; color: var(--text-secondary); }

    .player-controls { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 40%; }
    .control-buttons { display: flex; align-items: center; gap: 22px; }
    .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 18px; transition: 0.2s; }
    .ctrl-btn:hover { color: var(--text-primary); }
    .play-pause-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--text-primary); color: var(--bg-black); font-size: 16px; font-weight: bold; }
    
    .progress-container { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 480px; font-size: 11px; color: var(--text-secondary); }
    .progress-bar { flex: 1; height: 6px; background: #4d4d4d; border-radius: 3px; overflow: hidden; cursor: pointer; touch-action: none; transition: height 0.1s; }
    .progress-bar:hover { height: 8px; }
    .progress-bar:hover .progress-fill { background: var(--spotify-green); }
    .progress-fill { height: 100%; background: var(--text-primary); width: 0%; }

    .right-controls { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
    .dj-toggle-btn { background: var(--bg-elevated); border: 1px solid #3e3e3e; color: var(--text-secondary); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .dj-toggle-btn.dj-on { background: var(--brat-neon); color: #000; border-color: var(--brat-neon); }
    .btn-force-dj { background: transparent; border: 1px solid var(--text-secondary); color: var(--text-primary); padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; }
    .overlay-login { display: none; position: fixed; inset: 0; z-index: 100; background: var(--bg-black); flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 24px; color: var(--text-secondary); }
    .btn-menu { display: none; position: absolute; top: 12px; left: 12px; z-index: 5; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid #3e3e3e; border-radius: 8px; width: 40px; height: 40px; font-size: 20px; }
    .content { overflow-y: auto; }

    /* Móvil / Android */
    @media (max-width: 768px) {
      body { height: 100dvh; }
      .main-container { flex-direction: column; padding: 4px; gap: 4px; position: relative; }
      .btn-menu { display: block; }
      .sidebar { display: none; width: 100%; max-height: 55dvh; }
      .sidebar.abierto { display: flex; }
      .content { padding: 56px 16px 16px; justify-content: flex-start; }
      .album-art { width: min(60vw, 240px); height: min(60vw, 240px); margin-bottom: 16px; }
      .track-title { font-size: 22px; }
      .player-bar { height: auto; flex-direction: column; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
      .now-playing-mini { display: none; }
      .player-controls, .right-controls { width: 100%; }
      .right-controls { justify-content: center; }
      .progress-bar { height: 10px; }
    }

    /* ===== Estilo tipo Spotify ===== */
    .ctrl-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; font-size: 0; transition: color .15s, transform .15s; }
    .ctrl-btn:hover { color: #fff; transform: scale(1.1); }
    .ctrl-btn:active { transform: scale(.94); }
    .play-pause-btn { width: 40px; height: 40px; background: #fff; color: #000; }
    .play-pause-btn:hover { background: #fff; color: #000; transform: scale(1.07); }
    .control-buttons { gap: 24px; }
    .progress-bar { position: relative; height: 4px; overflow: visible; border-radius: 2px; transition: none; }
    .progress-bar:hover { height: 4px; }
    .progress-bar::before { content: ''; position: absolute; inset: -10px 0; } /* zona de toque más grande */
    .progress-fill { position: relative; border-radius: 2px; }
    .progress-fill::after { content: ''; position: absolute; right: -6px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.5); opacity: 0; transition: opacity .15s; }
    .progress-bar:hover .progress-fill::after { opacity: 1; }
    .dj-toggle-btn { display: flex; align-items: center; gap: 8px; padding: 9px 18px; letter-spacing: .3px; transition: transform .15s, background .2s, box-shadow .2s, color .2s; }
    .dj-toggle-btn:hover { transform: scale(1.04); color: #fff; border-color: #6a6a6a; }
    .dj-toggle-btn.dj-on { box-shadow: 0 0 18px rgba(138, 206, 0, .45); }
    .dj-toggle-btn.dj-on:hover { color: #000; }
    .dj-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .7; }
    .dj-on .dj-dot { opacity: 1; animation: pulso 1.4s ease-in-out infinite; }
    @keyframes pulso { 50% { transform: scale(1.6); opacity: .4; } }
    .btn-login { display: inline-block; border-radius: 500px; letter-spacing: .3px; transition: transform .15s, background .2s; }
    .btn-login:hover { transform: scale(1.04); }
    .token-box a { color: var(--text-secondary); text-decoration: none; font-weight: 700; }
    .token-box a:hover { color: #fff; text-decoration: underline; }
    @media (max-width: 768px) { .progress-fill::after { opacity: 1; } .ctrl-btn { width: 44px; height: 44px; } .play-pause-btn { width: 48px; height: 48px; } }
    :root { --safe-top: max(env(safe-area-inset-top, 0px), 28px); }
    @media (max-width: 768px) {
      body { padding-top: var(--safe-top); } /* deja libre la barra de estado (hora, notificaciones) */
      .content { padding: 16px; justify-content: center; }
    }
    .logo { font-size: 20px; }
    .logo-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 14px rgba(160, 90, 200, .35); }
    .logo-txt { letter-spacing: .5px; }
    .overlay-login .logo { flex-direction: column; font-size: 26px; gap: 14px; }
    .overlay-login .logo-img { width: 132px; height: 132px; box-shadow: 0 0 40px rgba(160, 90, 200, .45); }
    .lang-sel { display: flex; gap: 6px; }
    .lang-btn { flex: 1; background: #2a2a2a; border: 1px solid #3e3e3e; color: var(--text-secondary); padding: 7px 0; border-radius: 16px; font-size: 12px; font-weight: 700; cursor: pointer; transition: .15s; }
    .lang-btn:hover { color: #fff; border-color: #6a6a6a; }
    .lang-btn.activo { background: var(--brat-neon); color: #000; border-color: var(--brat-neon); }
    .overlay-login .lang-sel { width: 140px; }

    /* ===== Vistas: Locución / Listas ===== */
    .content { justify-content: flex-start; }
    .vista-tabs { display: flex; gap: 4px; background: rgba(0,0,0,.4); padding: 4px; border-radius: 24px; margin-bottom: 18px; flex-shrink: 0; }
    .vista-tab { background: transparent; border: 0; color: var(--text-secondary); padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .2s, color .2s; }
    .vista-tab:hover { color: #fff; }
    .vista-tab.activo { background: var(--brat-neon); color: #000; }
    .vista { width: 100%; display: flex; flex-direction: column; align-items: center; margin: auto 0; }
    .vista[hidden] { display: none; }
    .listas-card { width: 100%; max-width: 560px; text-align: left; display: flex; flex-direction: column; gap: 12px; }
    .listas-card h2 { font-size: 20px; }
    .listas-card label { font-size: 12px; color: var(--text-secondary); font-weight: 600; display: block; margin-bottom: 4px; }
    .listas-card textarea, .listas-card select { background: #2a2a2a; border: 1px solid #3e3e3e; color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; width: 100%; }
    .listas-card textarea { resize: vertical; }
    .listas-fila { display: flex; gap: 10px; }
    .listas-fila > div { flex: 1; min-width: 0; }
    .listas-card button.btn-login { border: 0; cursor: pointer; font-size: 14px; padding: 12px; }
    .listas-card button.btn-login:disabled { opacity: .55; cursor: wait; }
    .lista-estado { font-size: 13px; color: var(--text-secondary); line-height: 1.4; min-height: 18px; }
    .lista-estado.error { color: #ff7b7b; }
    .lista-resultado { background: rgba(0,0,0,.4); border: 1px solid rgba(138,206,0,.3); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .lista-resultado h3 { font-size: 16px; }
    .lista-resultado a { color: var(--brat-neon); font-size: 13px; font-weight: 700; text-decoration: none; }
    .lista-resultado ol { padding-left: 22px; font-size: 13px; color: #e0e0e0; display: flex; flex-direction: column; gap: 3px; max-height: 260px; overflow-y: auto; }
    .lista-resultado ol span { color: var(--text-secondary); }
    .lista-resultado p { font-size: 12px; color: var(--text-secondary); }
    .btn-reconectar { text-align: center; }
  </style>
</head>
<body>
  <div id="avisoIos" class="aviso-ios" style="display:none"><span id="avisoIosTexto"></span><button id="avisoIosCerrar" aria-label="✕">✕</button></div>

  <!-- Pantalla de login: aparece solo si no hay sesión de Spotify. La sesión se renueva sola en el servidor. -->
  <div id="overlayLogin" class="overlay-login">
    <div class="logo"><img class="logo-img" src="/logo.png" alt="" /><strong class="logo-txt">Velvet Dial</strong></div>
    <p data-i18n="loginMsg"></p>
    <a href="/login" class="btn-login" style="padding:12px 28px;font-size:15px;" data-i18n="btnLogin"></a>
    <div class="lang-sel"><button class="lang-btn" data-lang="es">ES</button><button class="lang-btn" data-lang="en">EN</button></div>
  </div>

  <div class="main-container">
    <button id="btnMenu" class="btn-menu" data-i18n-aria="menu">☰</button>
    <aside class="sidebar">
      <div class="logo"><img class="logo-img" src="/logo.png" alt="" /><strong class="logo-txt">Velvet Dial</strong></div>
      <div class="token-box">
        <label>Spotify</label>
        <span id="estadoSesion" style="font-size:12px;color:var(--text-secondary);"></span>
        <a href="/logout" style="font-size:12px;color:var(--text-secondary);" data-i18n="logout"></a>
      </div>
      <div class="token-box">
        <label for="inputAmbiente" data-i18n="promptLabel"></label>
        <textarea id="inputAmbiente" maxlength="300" rows="4" data-i18n-placeholder="promptPlaceholder"
          style="background:#2a2a2a;border:1px solid #3e3e3e;color:white;padding:8px;border-radius:4px;font-size:12px;resize:vertical;width:100%;"></textarea>
        <span style="font-size: 11px; color: var(--text-secondary);" data-i18n="promptHelp"></span>
      </div>
      <div class="token-box">
        <label for="selectVoz" data-i18n="vozTitulo"></label>
        <select id="selectVoz" style="background:#2a2a2a;border:1px solid #3e3e3e;color:white;padding:8px;border-radius:4px;font-size:12px;width:100%;">
          <option value="es-m">Español · Hombre</option>
          <option value="es-f">Español · Mujer</option>
          <option value="en-m">English · Male</option>
          <option value="en-f">English · Female</option>
        </select>
        <span style="font-size: 11px; color: var(--text-secondary);" data-i18n="vozAyuda"></span>
      </div>
      <div class="token-box">
        <label data-i18n="idioma"></label>
        <div class="lang-sel"><button class="lang-btn" data-lang="es">Español</button><button class="lang-btn" data-lang="en">English</button></div>
      </div>
    </aside>

    <main class="content">
      <nav class="vista-tabs" role="tablist">
        <button id="tabDj" class="vista-tab activo" role="tab" aria-selected="true" data-i18n="tabLocucion"></button>
        <button id="tabListas" class="vista-tab" role="tab" aria-selected="false" data-i18n="tabListas"></button>
      </nav>

      <!-- Vista 1: la radio con locutor (lo de siempre) -->
      <section id="vistaDj" class="vista">
        <img id="mainCover" class="album-art" src="/logo.png" alt="" />
        <h1 id="mainTitle" class="track-title"></h1>
        <p id="mainArtist" class="track-artist"></p>

        <div class="dj-status-card">
          <span class="dj-badge" id="djBadge"></span>
          <p class="dj-script" id="djScript"></p>
        </div>
      </section>

      <!-- Vista 2: listas de reproducción o cola creadas con IA. El DJ sigue funcionando mientras estás aquí. -->
      <section id="vistaListas" class="vista" hidden>
        <div class="listas-card">
          <h2 data-i18n="listasTitulo"></h2>
          <div>
            <label for="inputListaPrompt" data-i18n="listasPromptLabel"></label>
            <textarea id="inputListaPrompt" maxlength="300" rows="3" data-i18n-placeholder="listasPlaceholder"></textarea>
          </div>
          <div class="listas-fila">
            <div>
              <label for="selectListaCantidad" data-i18n="listasCantidad"></label>
              <select id="selectListaCantidad"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="40">40</option></select>
            </div>
            <div>
              <label for="selectListaModo" data-i18n="listasModo"></label>
              <select id="selectListaModo">
                <option value="lista" data-i18n="listasModoLista"></option>
                <option value="cola" data-i18n="listasModoCola"></option>
              </select>
            </div>
          </div>
          <button id="btnCrearLista" class="btn-login" data-i18n="listasCrear"></button>
          <p id="listaEstado" class="lista-estado" aria-live="polite"></p>
          <a id="btnReconectar" href="/login" class="btn-login btn-reconectar" hidden data-i18n="listasReconectar"></a>
          <div id="listaResultado" class="lista-resultado" hidden>
            <h3 id="listaNombre"></h3>
            <a id="listaEnlace" href="#" target="_blank" rel="noopener" data-i18n="listasAbrir"></a>
            <ol id="listaCanciones"></ol>
            <p id="listaNoEncontradas"></p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="player-bar">
    <div class="now-playing-mini">
      <img id="miniCover" class="mini-cover" src="/logo.png" alt="" />
      <div class="mini-info">
        <h4 id="miniTitle"></h4>
        <p id="miniArtist">—</p>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button id="btnPrev" class="ctrl-btn" data-i18n-aria="prev"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12L18 18V6z"/></svg></button>
        <button id="btnPlayPause" class="ctrl-btn play-pause-btn" data-i18n-aria="playpause"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="btnNext" class="ctrl-btn" data-i18n-aria="next"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="progress-container">
        <span id="timeCurrent">0:00</span>
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        <span id="timeTotal">0:00</span>
      </div>
    </div>

    <div class="right-controls">
      <button id="btnToggleDj" class="dj-toggle-btn"></button>
    </div>
  </footer>

  <audio id="djAudioPlayer" preload="auto"></audio>

  <script>
    // ============ IDIOMA DE LA INTERFAZ (ES / EN) ============
    // Para añadir un texto: ponlo en los dos idiomas aquí y úsalo con data-i18n="clave" (HTML) o t('clave') (JS).

      es: {
        titulo: 'Velvet Dial', loginMsg: 'Conecta tu cuenta de Spotify para empezar.', btnLogin: 'Conectar con Spotify',

        djDefault: 'Activa el Modo DJ para transiciones profesionales.',

        djBtnOff: 'DJ IA', djBtnOn: 'DJ IA activo',
        bReposoOn: '● DJ IA EN VIVO (ACTIVO)', bReposoOff: '● MODO REPRODUCTOR NORMAL', bPrecargando: '⏳ PRECARGANDO LOCUCIÓN...',
        bListo: '✨ LISTO (DJ: {s}S)', bErrGenerar: '⚠️ ERROR AL GENERAR LA LOCUCIÓN', bPulsaDj: '⚠️ PULSA "DJ IA" PARA ACTIVAR EL AUDIO',
        bAlAireRet: '🎚️ DJ AL AIRE (LLEGÓ JUSTO: SE RETIENE LA SIGUIENTE)', bAlAire: '🎚️ DJ AL AIRE (MÚSICA BAJA)...',
        bErrLocucion: '⚠️ ERROR EN LA LOCUCIÓN', bSiguiente: '● DJ IA (SIGUIENTE CANCIÓN)', bSinTiempo: '● DJ: SIN TIEMPO PARA HABLAR EN ESTA CANCIÓN',
        avisoIosInstalar: 'Para instalarla en tu iPhone: pulsa Compartir y luego "Añadir a pantalla de inicio". Ojo: en iPhone el DJ solo habla con la app abierta y la pantalla encendida.',
        tabLocucion: 'Locución', tabListas: 'Listas',
        listasTitulo: 'Crear una lista con IA', listasPromptLabel: 'Describe qué quieres escuchar',
        listasPlaceholder: 'Ej.: es por la mañana y quiero empezar el día con música energizante',
        listasCantidad: 'Canciones', listasModo: 'Qué hacer', listasModoLista: 'Crear lista y reproducirla', listasModoCola: 'Añadir a la cola',
        listasCrear: 'Crear', listasAbrir: 'Abrir en Spotify', listasReconectar: 'Reconectar Spotify',
        listasFaltaPrompt: 'Escribe primero qué tipo de música quieres.',

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // Si el sistema suspende el audio (llamada, segundo plano...) con el DJ activo, se reanuda solo
        audioCtx.onstatechange = () => { dlog(`audioCtx → ${audioCtx.state}`); if (djActivo && audioCtx.state !== 'running') audioCtx.resume().catch(() => {}); };
      }
      if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
    }
    const desbloquearAudio = asegurarAudioCtx;

    // Tono de 25 Hz a ~-50 dB: no se oye (los altavoces de móvil ni lo reproducen) pero no es silencio absoluto, así que Chrome
    // trata la página como "con audio" y no la frena ni la congela en segundo plano. No usa el foco de audio: Spotify no se entera.
    // No se usa en iPhone: ahí mantendría la sesión de audio abierta e interrumpiría a Spotify.
    let mantenedorOsc = null;
    function mantenerAudioVivo(activar) {
      try {
        if (!activar) { mantenedorOsc?.stop(); mantenedorOsc = null; return; }
        if (ES_IOS || mantenedorOsc || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        osc.frequency.value = 25;
        const g = audioCtx.createGain();
        g.gain.value = 0.003;
        osc.connect(g).connect(audioCtx.destination);
        osc.start();
        mantenedorOsc = osc;
        dlog('audio de mantenimiento activo');
      } catch (e) { dlog('⚠ audio de mantenimiento: ' + e.message); }
    }

    btnToggleDj.addEventListener('click', () => {
      djActivo = !djActivo;
      // App Android: servicio en primer plano para que el DJ siga con la pantalla bloqueada
      if (ES_APP_ANDROID && AudioDucking) (djActivo ? AudioDucking.iniciarSegundoPlano() : AudioDucking.detenerSegundoPlano()).catch(() => {});
      // App Android: pide una sola vez que el sistema no "duerma" la app para ahorrar batería (si no, algunos móviles la congelan)
      if (djActivo && ES_APP_ANDROID && AudioDucking && !localStorage.getItem('vd_bateria')) {
        localStorage.setItem('vd_bateria', '1');
        tOut(() => AudioDucking.pedirSinOptimizacionBateria().catch(() => {}), 6000); // tras el aviso de notificaciones
      }
      // Móvil en la web (iPhone sobre todo): una página no puede seguir viva con la pantalla bloqueada, así que se mantiene encendida
      if (ES_MOVIL_WEB && !ES_APP_ANDROID) mantenerPantallaEncendida(djActivo);
      btnToggleDj.classList.toggle('dj-on', djActivo);
      btnToggleDj.innerHTML = '<span class="dj-dot"></span>' + t(djActivo ? 'djBtnOn' : 'djBtnOff');
      if (djActivo && !transicionEnCurso) { locucionPreparada = false; desbloquearAudio(); }
      mantenerAudioVivo(djActivo);
      dlog(djActivo ? 'DJ activado' : 'DJ desactivado');
      if (!transicionEnCurso && !precargandoEnCurso) badgeReposo();
    });

    // ============ COMANDOS A SPOTIFY (vía nuestro servidor) ============
    async function enviarComando(action, extraBody = {}) {
      const spotifyToken = getToken();
      if (!spotifyToken) return;
      try {
        // El servidor decide el método HTTP real hacia Spotify; aquí siempre POST
        dlog(`→ comando a Spotify: ${action}`);
        const rc = await fetch(`/api/player/${action}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spotifyToken, ...extraBody }),
          signal: limite(10000)
        });
        if (!rc.ok) dlog(`⚠ comando ${action} rechazado (${rc.status})`);
      } catch (err) {
        console.error("Error comando Spotify:", err);
      }
    }

    // Devuelve true/false según si Spotify aceptó el cambio de volumen
    async function cambiarVolumenSpotify(percent) {
      const spotifyToken = getToken();
      if (!spotifyToken) return false;
      try {
        const res = await fetch('/api/player/volume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spotifyToken, volume_percent: percent }),
          signal: limite(10000)
        });
        const data = await res.json();
        if (!data.success) {
          console.warn("⚠️ Spotify rechazó el cambio de volumen (móvil o sin Premium)", data.details);
          if (res.status === 403) soportaVolumen = false; // VOLUME_CONTROL_DISALLOWED: Spotify no deja controlar el volumen del móvil
        }
        return !!data.success;
      } catch (e) {
        console.error("Error cambiando volumen en Spotify:", e);
        return false;
      }
    }

    // Fundido de volumen SUAVE: durante `duracionMs` envía valores intermedios siguiendo una curva
    // ease-in-out (arranca y termina despacio). Cada llamada espera la respuesta de Spotify, así que
    // el ritmo se adapta solo a la latencia y no se saturan las peticiones. Termina siempre en `hasta` exacto.
    async function fundirVolumen(desde, hasta, duracionMs = DUCK_FADE_MS) {
      const inicio = performance.now();
      let ultimo = desde;
      while (true) {
        if (!soportaVolumen) return; // este dispositivo no permite cambiar el volumen
        const t = Math.min(1, (performance.now() - inicio) / duracionMs);
        const curva = t * t * (3 - 2 * t);
        const valor = Math.round(desde + (hasta - desde) * curva);
        if (valor !== ultimo || t >= 1) {
          await cambiarVolumenSpotify(valor);
          ultimo = valor;
        }
        if (t >= 1) break;
        await esperar(60);
      }
    }

    btnPlayPause.addEventListener('click', () => {
      isPlaying = !isPlaying; // respuesta visual inmediata
      enviarComando(isPlaying ? 'play' : 'pause');
      tOut(actualizarEstado, 500);
    });
    document.getElementById('btnNext').addEventListener('click', () => { enviarComando('next'); tOut(actualizarEstado, 500); });
    document.getElementById('btnPrev').addEventListener('click', () => { enviarComando('previous'); tOut(actualizarEstado, 500); });

    // ============ 1. PRECARGA (≈40 s antes del final) ============
    // Pide el guion + la voz al servidor, que devuelve el mp3 en base64 para decodificarlo en memoria.
    // Así, cuando toca hablar, el audio arranca al instante, sin depender de la red.
    function liberarAudio() { bufferDj = null; }

    async function precargarLocucion() {
      if (locucionPreparada || precargandoEnCurso || transicionEnCurso) return;
      const spotifyToken = getToken();
      if (!spotifyToken) return;

      const idAlIniciar = ultimaCancionId;
      precargaIntentadaPara = idAlIniciar;
      const t0 = performance.now();
      const ambiente = ambienteActual(); // el prompt con el que se genera esta locución
      const voz = vozActual();           // y la voz (idioma + género)
      console.info(`[DJ] precarga iniciada (restante=${Math.round(duracionCancionMs - progresoActualMs())}ms, intento ${fallosPrecarga + 1})`);
      dlog(`precarga iniciada (restante ${Math.round((duracionCancionMs - progresoActualMs()) / 1000)}s, intento ${fallosPrecarga + 1})`);
      precargandoEnCurso = true;
      setBadge('bPrecargando');

      try {
        const res = await fetch('/api/crear-bloque', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spotifyToken, ultimaCancionConocida: ultimaCancionNombre, ambiente, ubicacion, voz }),
          signal: limite(60000) // si se cuelga, falla y se reintenta (antes se quedaba "precargando" para siempre)
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'El servidor no pudo crear la locución');

        // Descargamos el mp3 exacto de esta locución (URL única por bloque)
        // El servidor envía el mp3 en base64 dentro de la propia respuesta
        const bytes = Uint8Array.from(atob(data.audioBase64), c => c.charCodeAt(0));

        // Si la canción cambió mientras se generaba, esta locución ya no sirve
        if (idAlIniciar !== ultimaCancionId) return;
        // Si el usuario cambió el prompt mientras se generaba, esta locución ya no vale: se vuelve a generar
        if (ambiente !== ambienteActual() || voz !== vozActual()) { precargaIntentadaPara = null; return; }

        asegurarAudioCtx();
        dlog(`audio recibido, decodificando (audioCtx=${audioCtx.state})`);
        bufferDj = await audioCtx.decodeAudioData(bytes.buffer);
        duracionAudioDjMs = bufferDj.duration * 1000; // duración EXACTA de la voz
        tiempoGeneracionMs = performance.now() - t0;
        fallosPrecarga = 0;
        console.info(`[DJ] locución lista: voz=${Math.round(duracionAudioDjMs)}ms, generación=${Math.round(tiempoGeneracionMs)}ms`);
        dlog(`locución lista (voz ${Math.round(duracionAudioDjMs / 1000)}s, generación ${Math.round(tiempoGeneracionMs / 1000)}s)`);

        document.getElementById('djScript').textContent = `"${data.guion}"`;
        guionMostrado = true;
        locucionPreparada = true;
        setBadge('bListo', { s: Math.round(duracionAudioDjMs / 1000) });
      } catch (e) {
        console.error("Error al precargar locución:", e);
        dlog(`⚠ precarga fallida: ${e.name === 'AbortError' ? 'sin respuesta (límite de tiempo)' : e.message}`);
        fallosPrecarga++;
        ultimoFalloTs = performance.now();
        setBadge('bErrGenerar');
      } finally {
        precargandoEnCurso = false;
      }
    }

    // ============ 2. TRANSICIÓN ============
    // Línea de tiempo (cuando todo llega a tiempo):
    //   t=0               la música empieza a bajar suavemente (DUCK_FADE_MS)
    //   t=VOZ_RETRASO     entra la voz del DJ
    //   voz - SUBIDA_ANTES la música empieza a subir de nuevo, bajo las últimas palabras
    //   fin de la voz     ≈ ANTICIPACION_MS antes del final de la canción -> la siguiente entra limpia
    // Si la locución llegó TARDE (no cabe antes del final), se usa el modo "retenida": se pausa la canción
    // justo antes de que acabe, se espera a que termine la voz y se pasa a la siguiente (así nunca se pisan).
    // `saltarAlTerminar` (ya no se usa desde la interfaz): si es true, tras la voz se salta a la siguiente canción.
    // Modo pausa (sin control de volumen): la voz suena sola, así que basta con lo que dura la voz
    const tiempoNecesarioMs = () => (soportaVolumen || usaDuckNativo()) ? VOZ_RETRASO_MS + duracionAudioDjMs + ANTICIPACION_MS + ajusteMs() : duracionAudioDjMs + 500;

    async function ejecutarTransicion({ saltarAlTerminar = false } = {}) {
      if (transicionEnCurso || !locucionPreparada || !bufferDj) return;

      // Comprobación previa: si el navegador aún no permite audio, se aborta SIN tocar volumen ni canción
      if (audioCtx?.state !== 'running') await audioCtx?.resume().catch(() => {});
      if (audioCtx?.state !== 'running') {
        console.warn('[DJ] AudioContext bloqueado: pulsa el botón DJ para activarlo');
        dlog(`⚠ audio bloqueado (audioCtx=${audioCtx?.state}): no se emite la locución`);
        setBadge('bPulsaDj');
        locucionPreparada = false;
        return;
      }
      transicionEnCurso = true;

      const idTransicion = ultimaCancionId;
      const restante = duracionCancionMs - progresoActualMs();
      const duckNativo = usaDuckNativo();
      const modoPausa = !duckNativo && !soportaVolumen;
      const retenida = !modoPausa && !saltarAlTerminar && restante < tiempoNecesarioMs() - 1500;
      dlog(`transición: restante ${Math.round(restante / 1000)}s, voz ${Math.round(duracionAudioDjMs / 1000)}s, modo ${duckNativo ? 'ducking nativo' : modoPausa ? 'pausa' : 'volumen'}${retenida ? ' (retenida)' : ''}, audioCtx=${audioCtx?.state}`);
      console.info(`[DJ] restante=${Math.round(restante)}ms voz=${Math.round(duracionAudioDjMs)}ms necesario=${Math.round(tiempoNecesarioMs())}ms ajuste=${ajusteMs()}ms vol=${volumenOriginal}% retenida=${retenida}`);
      setBadge(retenida ? 'bAlAireRet' : 'bAlAire');

      const timers = [];
      let duckNativoActivo = false;
      let pausadaPorFallo = false; // el primer cambio de volumen falló: se pasa a modo pausa sobre la marcha
      let fadeBajada = Promise.resolve();
      let fadeSubida = Promise.resolve();
      let terminarVoz;
      let vozReprodujo = false; // solo si la voz sonó de verdad se permite saltar de canción
      const finVoz = new Promise(r => { terminarVoz = r; });

      try {
        // 1) La música empieza a bajar ya; la voz entra un instante después
        if (duckNativo) {
          // Android baja solo el volumen de Spotify mientras tengamos el foco de audio
          const r = await AudioDucking.start().catch(() => ({ granted: false }));
          duckNativoActivo = !!r.granted;
          if (duckNativoActivo) {
            if (retenida) timers.push(tOut(() => enviarComando('pause'), Math.max(0, restante - 1200 - ajusteMs())));
            await esperar(VOZ_RETRASO_MS);
          } else { duckNativoFallido = true; pausadaPorFallo = true; await enviarComando('pause'); }
        } else if (modoPausa) {
          await enviarComando('pause'); // sin control de volumen: la música se pausa y la voz suena sola
        } else {
          fadeBajada = fundirVolumen(volumenOriginal, VOLUMEN_DUCK, DUCK_FADE_MS);
          if (retenida) timers.push(tOut(() => enviarComando('pause'), Math.max(0, restante - 1200 - ajusteMs())));
          await esperar(VOZ_RETRASO_MS);
          if (!soportaVolumen) { pausadaPorFallo = true; await enviarComando('pause'); }
        }

        const fuente = audioCtx.createBufferSource();
        fuente.buffer = bufferDj;
        // La voz pasa por una ganancia y un limitador: se amplifica sin saturar ni "romper" el audio
        const ganancia = audioCtx.createGain();
        ganancia.gain.value = GANANCIA_VOZ;
        const limitador = audioCtx.createDynamicsCompressor();
        limitador.threshold.value = -6;  // empieza a limitar cerca del tope
        limitador.knee.value = 3;
        limitador.ratio.value = 20;
        limitador.attack.value = 0.003;
        limitador.release.value = 0.1;
        fuente.connect(ganancia).connect(limitador).connect(audioCtx.destination);
        fuente.onended = () => terminarVoz(); // dispara justo al acabar la voz, sin estimaciones
        fuente.start();
        vozReprodujo = true;

        // 2) La música vuelve a subir bajo las últimas palabras (no hace falta en modo retenida: estará en pausa)
        if (!retenida && !modoPausa && !pausadaPorFallo && !duckNativoActivo) {
          timers.push(tOut(() => {
            fadeSubida = fadeBajada.then(() => fundirVolumen(VOLUMEN_DUCK, volumenOriginal, SUBIDA_FADE_MS));
          }, Math.max(0, duracionAudioDjMs - SUBIDA_ANTES_MS)));
        }

        // 3) Esperar a que acabe la voz (con margen de seguridad por si 'ended' no llega)
        timers.push(tOut(terminarVoz, duracionAudioDjMs + 4000));
        await finVoz;
      } catch (err) {
        console.error('[DJ] Falló la locución (la canción NO se salta):', err);
        dlog(`⚠ locución fallida: ${err.message}`);
        setBadge('bErrLocucion');
      } finally {
        timers.forEach(tClear);
        await Promise.all([fadeBajada, fadeSubida]); // que ningún fundido quede a medias
        setBadge('bSiguiente');
        if (duckNativoActivo) await AudioDucking.stop().catch(() => {}); // Android devuelve el volumen a Spotify
        const detenida = retenida || modoPausa || pausadaPorFallo; // la música estuvo en pausa durante la voz
        if (!modoPausa && !pausadaPorFallo && !duckNativoActivo) await cambiarVolumenSpotify(volumenOriginal); // valor final exacto

        if (detenida) {
          if (vozReprodujo) {
            // Comprobar si Spotify ya había cambiado sola de canción antes de saltar (evita saltarse una de más)
            await actualizarEstado();
            if (ultimaCancionId === idTransicion) await enviarComando('next');
          }
          await enviarComando('play');
        } else if (vozReprodujo && saltarAlTerminar) {
          await enviarComando('next');
        }

        liberarAudio();
        locucionPreparada = false;
        transicionEnCurso = false;
        finTransicionTs = performance.now();
        badgeReposo();
      }
    }

    // ============ 3. RELOJ LOCAL ============
    // Spotify solo informa el progreso cada POLL_MS y con retrasos variables. Entre consultas
    // se interpola con performance.now(), y las decisiones de tiempo se toman aquí (cada TICK_MS).
    // ---- Control de posición: clic o arrastre sobre la barra de progreso ----
    const barraProgreso = document.querySelector('.progress-bar');
    const posDesdeEvento = (e) => {
      const r = barraProgreso.getBoundingClientRect();
      return Math.round(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * duracionCancionMs);
    };
    function pintarArrastre() {
      document.getElementById('timeCurrent').textContent = formatTime(posArrastreMs);
      document.getElementById('progressFill').style.width = `${(posArrastreMs / duracionCancionMs) * 100}%`;
    }
    barraProgreso.addEventListener('pointerdown', (e) => {
      if (!duracionCancionMs || transicionEnCurso) return; // no se puede mover la canción mientras habla el DJ
      arrastrando = true;
      barraProgreso.setPointerCapture(e.pointerId);
      posArrastreMs = posDesdeEvento(e);
      pintarArrastre();
    });
    barraProgreso.addEventListener('pointermove', (e) => {
      if (!arrastrando) return;
      posArrastreMs = posDesdeEvento(e);
      pintarArrastre();
    });
    barraProgreso.addEventListener('pointerup', (e) => {
      if (!arrastrando) return;
      arrastrando = false;
      buscarPosicion(posDesdeEvento(e));
    });
    barraProgreso.addEventListener('pointercancel', () => { arrastrando = false; });

    async function buscarPosicion(posMs) {
      // Reloj local al instante (sin esperar a Spotify)
      progresoBaseMs = posMs;
      inicioCancionTs = Date.now() - posMs;
      ignorarProgresoHasta = performance.now() + 2000;

      // ¿Queda tiempo para que el DJ hable bien en esta canción? Si no (saltó muy cerca del final), se omite en esta.
      // Si salta a un punto con tiempo de sobra, vuelve a estar disponible.
      const restante = duracionCancionMs - posMs;
      const margen = tiempoNecesarioMs() + (locucionPreparada ? 1500 : tiempoGeneracionMs * 1.3 + 2000);
      if (restante < margen) {
        djOmitidoId = ultimaCancionId;
        locucionPreparada = false;
        liberarAudio();
        if (djActivo && !precargandoEnCurso) setBadge('bSinTiempo');
      } else if (djOmitidoId === ultimaCancionId) {
        djOmitidoId = null; precargaIntentadaPara = null; fallosPrecarga = 0;
        if (!precargandoEnCurso) badgeReposo();
      }

      await enviarComando('seek', { position_ms: posMs });
      tOut(actualizarEstado, 1500);
    }

    // El progreso que informa Spotify llega con retraso VARIABLE (a veces 1-3 s). En vez de fiarnos de cada
    // consulta, guardamos el instante estimado de inicio de la canción y nos quedamos con la muestra MENOS retrasada
    // (la que da el inicio más temprano), como hace NTP. Se reinicia al pausar, cambiar de canción o saltar a otro punto.
    function progresoActualMs() {
      if (!isPlaying || inicioCancionTs === null) return Math.min(progresoBaseMs, duracionCancionMs);
      return Math.min(Date.now() - inicioCancionTs, duracionCancionMs);
    }

    let ultimoTickTs = 0, ultimoLatidoTs = 0;
    function tick() {
      const ahoraTick = Date.now();
      if (ultimoTickTs && ahoraTick - ultimoTickTs > 1500) dlog(`⚠ el reloj se paró ${Math.round((ahoraTick - ultimoTickTs) / 1000)}s (página en segundo plano/frenada)`);
      ultimoTickTs = ahoraTick;
      gestionarPoll();
      if (djActivo && ahoraTick - ultimoLatidoTs > 30000) { // latido del DJ cada 30 s: explica por qué actúa o no
        ultimoLatidoTs = ahoraTick;
        dlog(`♥ resta ${Math.round((duracionCancionMs - progresoActualMs()) / 1000)}s · sonando=${isPlaying} · lista=${locucionPreparada} · precargando=${precargandoEnCurso} · enCurso=${transicionEnCurso} · spotify hace ${Math.round((ahoraTick - ultimoSondeoTs) / 1000)}s · ctx=${audioCtx?.state} · ${document.visibilityState}`);
      }
      if (!duracionCancionMs) return;
      const progreso = progresoActualMs();
      const restante = duracionCancionMs - progreso;

      // UI (barra de progreso suave)
      if (!arrastrando) {
        document.getElementById('timeCurrent').textContent = formatTime(progreso);
        document.getElementById('progressFill').style.width = `${(progreso / duracionCancionMs) * 100}%`;
      }
      if (btnPlayPause.dataset.estado !== String(isPlaying)) { // solo se redibuja el icono cuando cambia
        btnPlayPause.dataset.estado = String(isPlaying);
        btnPlayPause.innerHTML = isPlaying ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      }

      // Datos de Spotify viejos (p. ej. al volver del segundo plano): no se actúa con un reloj dudoso
      if (Date.now() - ultimoSondeoTs > 10000) return;
      if (!djActivo || !isPlaying || transicionEnCurso || djOmitidoId === ultimaCancionId) return;

      // a) Precargar. Ventana adaptativa: mínimo PRECARGA_MS (60 s), pero se adelanta si la voz es larga
      //    o la generación tarda (si no, la locución llegaría tarde y se pisaría con la siguiente canción).
      const ventana = Math.min(90000, Math.max(PRECARGA_MS, duracionAudioDjMs + tiempoGeneracionMs * 1.3 + VOZ_RETRASO_MS + 4000));
      if (restante <= ventana && restante > 3000 && !locucionPreparada &&
          !precargandoEnCurso &&
          (precargaIntentadaPara !== ultimaCancionId ||
           (fallosPrecarga > 0 && fallosPrecarga < 3 && performance.now() - ultimoFalloTs > 3000))) { // hasta 3 intentos por canción
        precargarLocucion();
      }

      // b) Empezar cuando lo que queda de canción = lo que necesita la voz (bajada + voz + hueco final).
      //    (> 1000 ms: si la precarga llegó demasiado tarde, se omite el DJ en esta canción)
      if (locucionPreparada && restante <= tiempoNecesarioMs() && restante > 1000) {
        ejecutarTransicion();
      }
    }

    // ============ 4. SINCRONIZACIÓN CON SPOTIFY ============
    async function actualizarEstado() {
      const token = getToken();
      if (!token) return;

      try {
        const t0 = Date.now(); // hora real: performance.now() se queda parado cuando el móvil duerme
        const restabaAntes = duracionCancionMs ? duracionCancionMs - progresoActualMs() : null; // para el registro
        const volFiableAlPedir = volumenFiable();
        const res = await fetch('/api/estado', { headers: { 'Authorization': `Bearer ${token}` }, signal: limite(8000) });
        if (res.status === 401) { comprobarSesion(); return; } // el servidor intenta renovar; si no puede, aparece el login
        if (!res.ok) return;
        const data = await res.json();
        ultimoSondeoTs = Date.now();
        if (!data || !data.item) { isPlaying = false; return; }

        if (data.is_playing !== isPlaying) dlog(`Spotify: ${data.is_playing ? 'reproduciendo' : 'en pausa'} (progreso ${Math.round((data.progress_ms || 0) / 1000)}s)`);
        isPlaying = data.is_playing;

        // Volumen real del usuario. Solo se lee si la consulta empezó y terminó SIN locución y pasados 8 s desde la
        // última; si no, podríamos guardar como "original" el volumen ya bajado y la música se quedaría baja.
        if (volFiableAlPedir && volumenFiable() && typeof data.device?.volume_percent === 'number') {
          volumenOriginal = data.device.volume_percent;
        }

        tipoDispositivo = data.device?.type ?? null;
        if (data.device?.id !== dispositivoId) dlog(`dispositivo: ${data.device?.name} (${data.device?.type}) vol=${data.device?.volume_percent}`);
        if (data.device?.id !== dispositivoId) { dispositivoId = data.device?.id ?? null; soportaVolumen = ES_APP_ANDROID || !['Smartphone', 'Tablet'].includes(tipoDispositivo); duckNativoFallido = false; } // al cambiar de dispositivo se vuelve a probar (los móviles sin la app nativa no permiten volumen: modo pausa)

        // Re-sincronizar el reloj local
        const muestraTs = (t0 + Date.now()) / 2 - (data.progress_ms || 0); // mitad del viaje de ida y vuelta
        const cambioDeCancion = ultimaCancionId !== data.item.id;
        if (performance.now() >= ignorarProgresoHasta || cambioDeCancion) {
          progresoBaseMs = data.progress_ms || 0;
          if (!data.is_playing || cambioDeCancion || inicioCancionTs === null || !estabaReproduciendo ||
              Math.abs(muestraTs - inicioCancionTs) > 3000) {
            inicioCancionTs = muestraTs;                          // reinicio: pausa, canción nueva o salto (seek)
          } else {
            inicioCancionTs = Math.min(inicioCancionTs, muestraTs); // nos quedamos con la muestra menos retrasada
          }
        }
        estabaReproduciendo = data.is_playing;
        duracionCancionMs = data.item.duration_ms || 1;

        const titulo = data.item.name;
        const artistas = data.item.artists.map(a => a.name).join(', ');
        ultimaCancionNombre = `${titulo} de ${artistas}`;

        // Cambio de canción: reiniciar el ciclo (sin interrumpir una locución que esté sonando)
        if (ultimaCancionId !== data.item.id) {
          ultimaCancionId = data.item.id;
          fallosPrecarga = 0;
          console.info('[DJ] canción nueva:', titulo);
          dlog(`canción nueva: ${titulo} (${Math.round((data.item.duration_ms || 0) / 1000)}s) · progreso en Spotify ${Math.round((data.progress_ms || 0) / 1000)}s · a la anterior le quedaban ${restabaAntes === null ? '?' : Math.round(restabaAntes / 1000) + 's'}`);
          if (!transicionEnCurso) {
            locucionPreparada = false;
            liberarAudio();
            if (!precargandoEnCurso) badgeReposo();
          }

          hayCancion = true;
          document.getElementById('mainTitle').textContent = titulo;
          document.getElementById('mainArtist').textContent = artistas;
          document.getElementById('miniTitle').textContent = titulo;
          document.getElementById('miniArtist').textContent = artistas;
          document.getElementById('timeTotal').textContent = formatTime(duracionCancionMs);
          const cover = data.item.album.images[0]?.url;
          if (cover) {
            document.getElementById('mainCover').src = cover;
            document.getElementById('miniCover').src = cover;
          }
        }
      } catch (e) { /* error silencioso: se reintenta en el siguiente ciclo */ }
    }

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Consulta a Spotify: cada POLL_MS, y cada 1 s durante el último minuto y cuarto (más muestras = mejor estimación).
    // La lanza el reloj (tick) en vez de una cadena de temporizadores: si una consulta se atasca, se reinicia sola.
    let pollEnCurso = false, pollId = 0, pollIniTs = 0, ultimoPollIniTs = 0;
    function gestionarPoll() {
      const ahora = Date.now();
      if (pollEnCurso && ahora - pollIniTs > 12000) { dlog('⚠ consulta a Spotify atascada: se reinicia'); pollId++; pollEnCurso = false; }
      const cerca = djActivo && duracionCancionMs && (duracionCancionMs - progresoActualMs()) < 75000;
      if (pollEnCurso || ahora - ultimoPollIniTs < (cerca ? 1000 : POLL_MS)) return;
      const miId = ++pollId;
      pollEnCurso = true; pollIniTs = ultimoPollIniTs = ahora;
      actualizarEstado().finally(() => { if (miId === pollId) pollEnCurso = false; });
    }

    // El reloj local (cada TICK_MS) corre en el worker de arriba, que no se frena en segundo plano
    if (relojW) relojW.postMessage({ op: 'tick', ms: TICK_MS });
    else setInterval(tick, TICK_MS);

    // ============ 5. SESIÓN Y MENÚ ============
    // Al abrir: si hay sesión, empieza solo; si no, aparece la pantalla de login.
    // Si el servidor está arrancando (Render tarda ~50 s en "despertar"), se reintenta sin molestar.
    async function comprobarSesion() {
      try {
        const data = await (await fetch('/api/estado-sesion')).json();
        sesionActiva = !!data.conectado;
        document.getElementById('overlayLogin').style.display = sesionActiva ? 'none' : 'flex';
        sesionClave = sesionActiva ? 'sesionOk' : 'sesionNo';
        document.getElementById('estadoSesion').textContent = t(sesionClave);
        if (sesionActiva) { actualizarEstado(); pedirUbicacion(); }
      } catch (e) {
        tOut(comprobarSesion, 3000);
      }
    }
    // Ubicación del dispositivo para el clima de SU ciudad. Se redondea a ~1 km y solo se envía al generar locuciones.
    // Si el usuario no da permiso, el servidor usa la ciudad por defecto (CIUDAD del .env).
    try { ubicacion = JSON.parse(localStorage.getItem('bratify_ubicacion')); } catch (e) { ubicacion = null; }
    function pedirUbicacion() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          ubicacion = { lat: +pos.coords.latitude.toFixed(2), lon: +pos.coords.longitude.toFixed(2) };
          localStorage.setItem('bratify_ubicacion', JSON.stringify(ubicacion));
        },
        (err) => console.warn('[DJ] Sin ubicación, se usa la ciudad por defecto:', err.message),
        { enableHighAccuracy: false, timeout: 15000, maximumAge: 3600000 }
      );
    }

    // Al volver a la app (p. ej. tras bloquear la pantalla): reanudar el audio y refrescar Spotify al instante
    document.addEventListener('visibilitychange', () => {
      dlog('página ' + (document.visibilityState === 'visible' ? 'visible' : 'oculta'));
      if (document.visibilityState === 'visible') {
        audioCtx?.resume?.().catch(() => {});
        actualizarEstado();
        if (djActivo && ES_MOVIL_WEB && !ES_APP_ANDROID) mantenerPantallaEncendida(true); // el sistema lo suelta al ocultar la página
      }
    });

    dlog(`inicio · ${ES_APP_ANDROID ? 'app Android' : ES_IOS ? 'iPhone/iPad' : 'web'} · worker=${!!relojW}`);
    aplicarIdioma();
    comprobarSesion();

    document.getElementById('btnMenu').addEventListener('click', () => document.querySelector('.sidebar').classList.toggle('abierto'));
  </script>
</body>
</html>
